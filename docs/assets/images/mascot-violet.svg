<svg xmlns="http://www.w3.org/2000/svg" class="ws-mascot-illustration" viewBox="65 18 330 315" width="400" height="400" role="img" aria-labelledby="mascot-title mascot-description">
  <!-- SPDX-FileCopyrightText: Copyright (c) 2026 whaleshell -->
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <title id="mascot-title">Whaleshell mascot</title>
  <desc id="mascot-description">A violet whale with expressive eyes, a moving tail, and a water spout.</desc>
  <style>
    .mascot-tail { transform-box: view-box; transform-origin: 112px 226px; animation: tail-swish 4.8s ease-in-out infinite; }
    .mascot-eye { transform-box: fill-box; transform-origin: center; animation: eye-blink 7.4s ease-in-out infinite; }
    .mascot-eye--far { animation-delay: .035s; }
    .mascot-spout { animation: spout-flow 4.8s ease-in-out infinite; }
    .mascot-drop { transform-box: fill-box; transform-origin: center bottom; animation: spout-drop 4.8s ease-in-out infinite; }
    .mascot-drop--left { animation-delay: .08s; }
    .mascot-drop--right { animation-delay: .16s; }
    @keyframes tail-swish { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(-7deg); } 70% { transform: rotate(4deg); } }
    @keyframes eye-blink { 0%, 32%, 34%, 35%, 69%, 71%, 72%, 100% { transform: scaleY(1); } 32.7%, 69.7% { transform: scaleY(.06); } }
    @keyframes spout-flow { 0%, 22%, 100% { opacity: 0; } 29% { opacity: 1; } 43% { opacity: .92; } 54%, 70% { opacity: 0; } }
    @keyframes spout-drop { 0%, 23%, 100% { opacity: 0; transform: translateY(7px) scale(.5); } 30% { opacity: 1; transform: translateY(0) scale(1); } 51% { opacity: 0; transform: translateY(-22px) scale(.72); } }
    @media (prefers-reduced-motion: reduce) { .mascot-tail, .mascot-eye, .mascot-spout, .mascot-drop { animation: none; } }
  </style>
  <defs>
    <linearGradient id="mascot-body" x1=".15" y1=".08" x2=".82" y2=".94">
      <stop stop-color="#c3a1ff"/>
      <stop offset=".54" stop-color="#9568ed"/>
      <stop offset="1" stop-color="#7044cb"/>
    </linearGradient>
    <linearGradient id="mascot-belly" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e8ddff"/>
    </linearGradient>
  </defs>

  <g transform="translate(400 0) scale(-1 1)">
  <g class="mascot-tail" fill="url(#mascot-body)" stroke="#26183f" stroke-width="8" stroke-linejoin="round">
    <path d="M118 231c-19-7-34-20-51-39-7-8-17-8-21-2-3 5 1 11 7 17-13-3-21 2-19 9 2 6 11 9 21 12-11 3-17 9-13 15 4 6 17 6 27 3 19-5 34-1 49 11z"/>
    <path d="M62 207c10 10 21 17 34 22M56 240c11-3 22-3 33-1" fill="none" stroke="#ddcaff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g class="mascot-water" fill="#d9c7ff">
    <path class="mascot-drop mascot-drop--left" d="M177 68c-6-8-17-15-15-22 2-7 10-5 17 4 5 6 7 12 8 20z"/>
    <path class="mascot-drop mascot-drop--middle" d="M194 61c-4-11-3-24 4-29 8 6 8 18 3 30l-3 8z"/>
    <path class="mascot-drop mascot-drop--right" d="M211 69c5-9 15-17 22-14 7 3 3 11-5 17-5 4-11 7-17 9z"/>
  </g>
  <path class="mascot-spout" d="M197 148c-5-25 5-48 1-80" fill="none" stroke="#cbb0ff" stroke-width="9" stroke-linecap="round"/>

  <path d="M103 239c0-57 41-99 104-103 61-4 105 31 112 82 8 57-31 99-92 111-57 11-111-16-122-55-3-12-4-23-2-35z" fill="url(#mascot-body)" stroke="#26183f" stroke-width="9" stroke-linejoin="round"/>
  <path d="M117 267c18 34 49 51 87 51 36 0 66-16 83-46-25 13-53 19-82 19-37 0-65-8-88-24z" fill="url(#mascot-belly)"/>

  <path d="M151 267c-4 17-1 31 10 41 14-5 24-15 27-29-10-8-23-12-37-12z" fill="#8152d8" stroke="#26183f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M160 276c8 3 15 8 20 15" fill="none" stroke="#d9c7ff" stroke-width="4" stroke-linecap="round"/>

  <g class="mascot-flipper" fill="url(#mascot-body)" stroke="#26183f" stroke-width="7" stroke-linejoin="round">
    <path d="M264 273c19 3 32 13 37 29-15 3-31-2-43-14z"/>
    <path d="M280 287c-6 2-12 2-18 0" fill="none" stroke="#d9c7ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="mascot-eye mascot-eye--far">
    <ellipse cx="235" cy="194" rx="21" ry="25" fill="#fff" stroke="#26183f" stroke-width="6"/>
    <ellipse cx="242" cy="197" rx="7" ry="10" fill="#26183f"/>
    <circle cx="244" cy="193" r="2.8" fill="#fff"/>
  </g>
  <g class="mascot-eye mascot-eye--near">
    <ellipse cx="276" cy="190" rx="24" ry="29" fill="#fff" stroke="#26183f" stroke-width="6"/>
    <ellipse cx="284" cy="194" rx="8" ry="12" fill="#26183f"/>
    <circle cx="287" cy="189" r="3" fill="#fff"/>
  </g>
  <path d="M269 244c13-5 26-3 34 5-3 12-13 20-25 19-11-1-18-9-18-18z" fill="#26183f"/>
  <path d="M274 253l8 1-1 7c-3 1-6-1-7-4zM287 254l8-1-2 7c-3 1-5 0-6-3z" fill="#fff"/>
  <circle cx="311" cy="228" r="5" fill="#e3d4ff" opacity=".9"/>

  </g>
</svg>
